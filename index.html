<title>しばサバイバー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one full-screen pixel canvas; DOM panels float over it for menus and level-up cards. Single sunny-meadow look in every theme. */
:root{
  --ink:#2b1a12;      /* outline brown, all text */
  --paper:#fff4dc;    /* shiba cream, panels */
  --tan:#e0913f;      /* shiba coat, primary buttons */
  --sun:#ffd23f;      /* XP, gold, highlights */
  --pink:#f2708f;     /* NEW tag, hearts */
  --meadow:#78bf63;   /* ground */
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--meadow);color:var(--ink);font-family:var(--font);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
[hidden]{display:none!important}
#world{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#world{image-rendering:pixelated}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#probe{position:fixed;top:0;left:0;width:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  box-sizing:border-box;text-align:center}
.dim{background:rgba(43,26,18,.55)}
.panel{max-height:100%;overflow-y:auto;background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:18px 16px;width:min(340px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{margin:0;font-size:44px;line-height:1;font-weight:400;color:var(--paper);text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px 3px var(--ink),3px -3px var(--ink),-3px -3px var(--ink),0 7px var(--ink);letter-spacing:.04em;text-wrap:balance}
h1 small{display:block;font-size:16px;margin-bottom:8px;color:var(--sun);text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink)}
h2{margin:0;font-size:28px;font-weight:400}
p{margin:0;font-size:15px;line-height:1.6}
.btn{font-family:var(--font);font-size:22px;color:var(--ink);background:var(--tan);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 28px;cursor:pointer;min-width:180px}
.panel .btn.sub{width:min(240px,100%)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:var(--paper);font-size:17px;padding:8px 20px;min-width:150px}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:16px;font-variant-numeric:tabular-nums;text-align:left}
.stats b{font-weight:400;text-align:right}
.best{font-size:13px;opacity:.8}
#title canvas{width:128px;height:120px;image-rendering:pixelated;animation:bob .5s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.coats{display:grid;grid-template-columns:repeat(4,74px);gap:8px}
.coat{font-family:var(--font);color:var(--ink);background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:13px}
.coat canvas{image-rendering:pixelated}
.coat[aria-checked="true"]{background:var(--sun);transform:translateY(-3px);box-shadow:0 6px 0 var(--ink)}
.coat.locked{background:#c9bfae;cursor:default}.coat.locked canvas{filter:brightness(0) opacity(.35)}
.coat small{font-size:10px;line-height:1.2;min-height:24px}
.perk{font-size:14px;color:var(--paper);text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);min-height:1.4em}
.dmgbars{display:flex;flex-direction:column;gap:5px;width:100%}
.dmgbars .row{display:grid;grid-template-columns:22px 112px 1fr;gap:6px;align-items:center;font-size:13px;text-align:left}
.dmgbars .sq{width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;box-sizing:border-box}
.dmgbars .bar{height:10px;background:var(--tan);border:2px solid var(--ink);min-width:2px;box-sizing:border-box}
.dmgbars .cap{font-size:12px;opacity:.75;text-align:left}
.modes{display:flex;gap:8px}
.mode{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:5px 14px;cursor:pointer}
.mode[aria-checked="true"]{background:var(--sun)}
.mode.hard[aria-checked="true"]{background:#ff7a7a;color:var(--paper);text-shadow:1px 1px 0 var(--ink)}
.mode:disabled{background:#c9bfae;cursor:default;opacity:.8}
.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.stamp{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;text-align:left;font-size:13px;line-height:1.35;border:2px dashed #b9a98f;padding:6px}
.stamp b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:400;font-size:15px;border:3px solid #c9bfae;color:#c9bfae;transform:rotate(-12deg)}
.stamp.got{border-style:solid;border-color:var(--ink)}
.stamp.got b{border-color:#d9443a;color:#d9443a}
.newstamp{color:#d9443a}
.evos{display:flex;flex-direction:column;gap:4px;width:100%;font-size:13px;text-align:left}
.evos .cap{font-size:12px;opacity:.75}
.evos .row{display:grid;grid-template-columns:22px auto 1fr;gap:6px;align-items:center}
.evos .sq{width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;box-sizing:border-box}
.evos .ok{color:#2f8a3a}.evos .no{opacity:.7}
.lvtitle{font-size:30px;color:var(--sun);text-shadow:2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.cards{display:flex;flex-direction:column;gap:12px;width:min(360px,100%)}
.card{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 12px;font-family:var(--font);color:var(--ink);cursor:pointer;opacity:0;transform:translateY(16px);animation:cardin .22s forwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
@keyframes cardin{to{opacity:1;transform:none}}
.ic{width:52px;height:52px;display:grid;place-items:center;font-size:30px;border:3px solid var(--ink);color:var(--ink)}
.cname{font-size:19px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.evocard{background:#fff3b0;box-shadow:0 5px 0 var(--ink),0 0 0 4px var(--sun)}
.cdesc small{font-size:12px;opacity:.75}
.cname i.evo{background:#e0473c}
.cname i{font-style:normal;font-size:13px;background:var(--pink);color:var(--paper);padding:1px 6px}
.cname em{font-style:normal;font-size:13px}
.cdesc{font-size:14px;line-height:1.45;margin-top:2px}
#pauseBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 34px);right:calc(env(safe-area-inset-right,0px) + 8px);width:40px;height:40px;font-family:var(--font);font-size:16px;background:var(--paper);border:3px solid var(--ink);color:var(--ink);box-shadow:0 3px 0 var(--ink);padding:0;cursor:pointer}
#title{overflow-y:auto;justify-content:safe center}
@media (max-height:760px){
  #title{gap:9px}
  h1{font-size:34px}
  h1 small{font-size:14px;margin-bottom:4px}
  #title p{font-size:13px;line-height:1.5}
  .coat canvas{width:38px!important;height:36px!important}
  .coat{padding:4px 2px 3px}
  .btn{font-size:19px;padding:8px 24px}
}
@media (prefers-reduced-motion:reduce){#title canvas,.card{animation:none;opacity:1;transform:none}}
</style>

<canvas id="c"></canvas>
<div id="probe"></div>
<button id="pauseBtn" hidden aria-label="一時停止">II</button>

<div id="title" class="layer">
  <canvas id="titleShiba" width="32" height="30"></canvas>
  <h1><small>5分間 生きのびろ</small>しば<br>サバイバー</h1>
  <p style="color:var(--paper);text-shadow:2px 2px 0 var(--ink)">指でなぞって動くだけ。攻撃は勝手に出る。<br>ホネを集めてレベルアップ、技を選んで強くなれ。</p>
  <div class="coats" id="coats" role="radiogroup" aria-label="柴をえらぶ"></div>
  <p class="perk" id="perk"></p>
  <div class="modes" id="modes" role="radiogroup" aria-label="むずかしさ"></div>
  <button class="btn" id="startBtn">さんぽに出る</button>
  <button class="btn sub" id="bookBtn">しば手帳</button>
  <p class="best" id="bestLine" style="color:var(--paper);text-shadow:1px 1px 0 var(--ink)"></p>
</div>

<div id="book" class="layer dim" hidden>
  <div class="panel">
    <h2>しば手帳</h2>
    <div class="stamps" id="stamps"></div>
    <button class="btn sub" id="bookClose">とじる</button>
  </div>
</div>

<div id="level" class="layer dim" hidden>
  <div class="lvtitle">レベルアップ!</div>
  <div class="cards" id="cards"></div>
  <button class="btn sub" id="rerollBtn">ひきなおす（のこり2）</button>
</div>

<div id="pause" class="layer dim" hidden>
  <div class="panel">
    <h2>ひとやすみ</h2>
    <div class="stats" id="pauseStats"></div>
    <div class="evos" id="pauseEvos"></div>
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn sub" id="soundBtn">おと: ON</button>
    <button class="btn sub" id="shakeBtn">画面ゆれ: ON</button>
    <button class="btn sub" id="buzzBtn">ふるえ: ON</button>
    <button class="btn sub" id="quitBtn">さんぽをやめる</button>
  </div>
</div>

<div id="over" class="layer dim" hidden>
  <div class="panel">
    <h2 id="overTitle">やられた…</h2>
    <div class="stats" id="overStats"></div>
    <div class="dmgbars" id="dmgBars"></div>
    <p class="best" id="overBest"></p>
    <button class="btn" id="moreBtn" hidden>まだ散歩する</button>
    <button class="btn sub" id="copyBtn">結果をコピー</button>
    <button class="btn" id="retryBtn">もう一回</button>
    <button class="btn sub" id="titleBtn">柴をえらびなおす</button>
  </div>
</div>

<script>
(()=>{
'use strict';
// ---------- canvas / scaling ----------
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const pix=document.createElement('canvas'), px=pix.getContext('2d');pix.id='world';document.body.insertBefore(pix,cv);
let lastFont='';
let W=195,H=422,S=2,DPR=1,cssW=390,cssH=844,safeTop=0,safeBot=0;
function resize(){
  cssW=innerWidth; cssH=innerHeight; DPR=Math.min(window.devicePixelRatio||1,2);
  S=Math.max(2,Math.round(Math.sqrt(cssW*cssH/(195*422)))); W=Math.ceil(cssW/S); H=Math.ceil(cssH/S);
  pix.width=W; pix.height=H; pix.style.width=W*S+'px'; pix.style.height=H*S+'px'; cv.width=Math.round(cssW*DPR); cv.height=Math.round(cssH*DPR);
  px.imageSmoothingEnabled=false; ctx.imageSmoothingEnabled=false; lastFont='';
  const cs=getComputedStyle(document.getElementById('probe'));
  safeTop=parseFloat(cs.paddingTop)||0; safeBot=parseFloat(cs.paddingBottom)||0;
}
addEventListener('resize',resize); resize();

// ---------- pixel sprite maker (auto outline) ----------
const OUT='#2b1a12';
const FONT='"DotGothic16","Hiragino Kaku Gothic ProN",sans-serif';
function makeSprite(w,h,paint,pal){
  const W2=w+2,H2=h+2,g=new Uint8Array(W2*H2);
  const set=(x,y,c)=>{x=Math.round(x)+1;y=Math.round(y)+1;if(x>=0&&y>=0&&x<W2&&y<H2)g[y*W2+x]=c;};
  const a={
    dot:(x,y,c)=>set(x,y,c),
    rect:(x,y,ww,hh,c)=>{for(let j=0;j<hh;j++)for(let i=0;i<ww;i++)set(x+i,y+j,c);},
    ell:(cx,cy,rx,ry,c)=>{for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)set(x,y,c);}}
  };
  paint(a);
  const o=g.slice();
  for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){
    if(g[y*W2+x])continue;
    if((x>0&&g[y*W2+x-1]>1)||(x<W2-1&&g[y*W2+x+1]>1)||(y>0&&g[(y-1)*W2+x]>1)||(y<H2-1&&g[(y+1)*W2+x]>1))o[y*W2+x]=1;
  }
  const mk=(flash,flip)=>{const c=document.createElement('canvas');c.width=W2;c.height=H2;const q=c.getContext('2d');
    for(let y=0;y<H2;y++)for(let x=0;x<W2;x++){const v=o[y*W2+x];if(!v)continue;
      q.fillStyle=v===1?OUT:(flash?'#ffffff':pal[v]);q.fillRect(flip?W2-1-x:x,y,1,1);}return c;};
  return {r:mk(0,0),l:mk(0,1),fr:mk(1,0),fl:mk(1,1),w:W2,h:H2};
}
// palette slots: 2 coat, 3 dark, 4 light, 5 black, 6 pink, 7 white, 8 gold
const P=(coat,dark,light,extra={})=>Object.assign([0,0,coat,dark,light,'#1d1410','#f48aa0','#ffffff','#f2b134'],extra);
function shibaSprites(pal,sesame){return [0,1].map(f=>makeSprite(17,16,a=>{
  if(f===0){a.rect(4,12,2,3,3);a.rect(10,12,2,3,3);}else{a.rect(5,12,2,3,3);a.rect(9,12,2,2,3);a.rect(3,12,2,2,3);}
  a.ell(7.5,10,5.6,3.3,2); a.ell(8,11.8,3.6,1.3,4);
  a.ell(2.6,7,2.3,2.3,2); a.dot(2,7,4); a.dot(3,6,4);
  a.ell(11.5,6.5,4.4,4,2);
  a.rect(8,1,2,3,2); a.dot(9,2,6); a.rect(13,1,2,3,2); a.dot(13,2,6);
  a.ell(12.6,8.4,2.7,1.7,4); a.dot(8,8,4);
  a.dot(10,6,5); a.dot(13,6,5); a.dot(10,4,4); a.dot(13,4,4); a.dot(12,7,5); a.dot(15,7,5);

  if(sesame)for(const [x,y] of [[4,8],[7,7],[10,9],[5,10],[9,8],[12,4],[2,6],[11,3],[6,9]])a.dot(x,y,3);
},pal));}
const COATS={
  aka:{name:'赤柴',spr:shibaSprites(P('#e0913f','#b5622a','#fff1d6')),start:'bone',perk:'ホネ投げで出発',lock:null},
  kuro:{name:'黒柴',spr:shibaSprites(P('#4b3b36','#2a1e1a','#fff1d6',{5:'#0a0605'})),start:'bark',startLv:2,perk:'ワン!Lv2で出発・威力+15%',lock:{text:'3分生きのびる',ok:b=>b.time>=180}},
  shiro:{name:'白柴',spr:shibaSprites(P('#fbf3e6','#d8c8b0','#ffffff')),start:'tail',perk:'しっぽボールで出発・HP自然回復',lock:{text:'合計1000匹たおす',ok:b=>(b.total||0)>=1000}},
  goma:{name:'胡麻柴',spr:shibaSprites(P('#d39554','#5a3a24','#fff1d6'),true),start:'fris',startLv:2,perk:'フリスビーLv2で出発・足が速い',lock:{text:'ボスをたおす',ok:b=>b.wins>=1}}
};
const OPT={shake:!matchMedia('(prefers-reduced-motion: reduce)').matches,buzz:true};try{Object.assign(OPT,JSON.parse(localStorage.getItem('shibasurv-opt')||'{}'));}catch(e){}
let diff='normal';try{const d=localStorage.getItem('shibasurv-diff');if(d==='hard')diff=d;}catch(e){}
let coat='aka';try{const c=localStorage.getItem('shibasurv-coat');if(c&&COATS[c])coat=c;}catch(e){}
const SHIBA=COATS.aka.spr;
const CHI=[0,1].map(f=>makeSprite(12,12,a=>{
  if(f===0){a.rect(3,9,1,3,3);a.rect(7,9,1,3,3);}else{a.rect(4,9,1,3,3);a.rect(6,9,1,3,3);}
  a.ell(5,8,3.6,2.2,2); a.dot(1,6,2); a.dot(1,5,2); a.dot(0,4,2);
  a.ell(8.6,5,3.1,2.9,2);
  a.rect(5,0,2,3,2); a.dot(6,1,6); a.rect(10,0,2,3,2); a.dot(10,1,6);
  a.rect(7,4,1,2,5); a.rect(10,4,1,2,5); a.dot(11,6,5); a.dot(9,7,4);
},P('#e9c07e','#c08f55','#fff3d9')));
const CORGI=[0,1].map(f=>makeSprite(16,12,a=>{
  if(f===0){a.rect(3,10,2,2,3);a.rect(10,10,2,2,3);}else{a.rect(4,10,2,2,3);a.rect(9,10,2,2,3);}
  a.ell(7.5,7.5,6.2,2.9,2); a.ell(8,9.2,4,1.2,4);
  a.ell(12,5,3.4,3.1,2); a.rect(12,3,1,4,4); a.ell(13.6,6.6,2.1,1.3,4);
  a.rect(9,0,2,3,2); a.dot(10,1,6); a.rect(13,0,2,3,2); a.dot(13,1,6);
  a.dot(11,5,5); a.dot(14,5,5); a.dot(15,6,5);
},P('#e98a35','#b45f1d','#fff3df')));
const BULL=[0,1].map(f=>makeSprite(16,14,a=>{
  if(f===0){a.rect(3,11,2,3,3);a.rect(10,11,2,3,3);}else{a.rect(4,11,2,3,3);a.rect(9,11,2,3,3);}
  a.ell(7,8.6,6.2,3.6,2); a.ell(5,7.5,2.2,1.6,3);
  a.ell(11.5,7,4.3,3.9,2); a.ell(12,9.6,3.6,1.7,4);
  a.rect(8,3,2,1,3); a.rect(14,3,2,1,3);
  a.dot(10,6,5); a.dot(13,6,5); a.dot(12,8,5); a.dot(11,10,7); a.dot(13,10,7); a.ell(12,6.6,.6,1.6,3);
},P('#eadbc4','#9c7a52','#fbf6ec')));
const HUSKY=[0,1].map(f=>makeSprite(16,13,a=>{
  if(f===0){a.rect(3,10,2,3,3);a.rect(10,10,2,3,3);}else{a.rect(4,10,2,3,3);a.rect(9,10,2,3,3);}
  a.ell(7,7.8,6,3.1,2); a.ell(7.5,9.4,4,1.3,4); a.ell(1.5,5.2,1.6,2.4,2); a.dot(1,4,4);
  a.ell(12,5,3.5,3.2,2); a.ell(12.6,6.4,2.6,1.8,4); a.rect(11,2,3,2,4);
  a.rect(9,0,2,3,2); a.rect(13,0,2,3,2);
  a.dot(11,4,8); a.dot(14,4,8); a.dot(15,6,5);
},P('#8a96a6','#5d6878','#f6f8fb',{8:'#43b8ff'})));
const ELITE=[0,1].map(f=>makeSprite(16,15,a=>{
  if(f===0){a.rect(3,12,2,3,3);a.rect(10,12,2,3,3);}else{a.rect(4,12,2,3,3);a.rect(9,12,2,3,3);}
  a.ell(7,9.6,6.2,3.6,2); a.ell(5,8.5,2.2,1.6,3);
  a.ell(11.5,8,4.3,3.9,2); a.ell(12,10.6,3.6,1.7,4);
  a.rect(8,4,2,1,3); a.rect(14,4,2,1,3);
  a.dot(10,7,5); a.dot(13,7,5); a.dot(12,9,5); a.dot(11,11,7); a.dot(13,11,7);
  a.dot(10,2,8); a.dot(11,3,8); a.dot(12,1,8); a.dot(13,3,8); a.dot(14,2,8); a.rect(10,3,5,1,8);
  a.rect(7,11,3,1,8);
},P('#8f79d6','#5f4aa6','#efe8ff')));
const BOSS=[0,1].map(f=>makeSprite(30,28,a=>{

// ---------- ground tiles ----------
const TILE=24, TILES=[];
const TCELL=120;
function obstaclesNear(x,y,R,out){out.length=0;const c0=Math.floor((x-R)/TCELL),c1=Math.floor((x+R)/TCELL),r0=Math.floor((y-R)/TCELL),r1=Math.floor((y+R)/TCELL);
  for(let cx=c0;cx<=c1;cx++)for(let cy=r0;cy<=r1;cy++){const h=hash(cx*7+3,cy*13+5);if(h%100>=42)continue;if(Math.abs(cx)<=1&&Math.abs(cy)<=1)continue;
    const ox=cx*TCELL+20+(h>>8)%80,oy=cy*TCELL+20+(h>>16)%80,rock=(h>>4)%3===0;out.push({x:ox,y:oy,r:rock?6:7,rock});}
  return out;}
const _ob=[];
function pushOut(u,ur){obstaclesNear(u.x,u.y,ur+10,_ob);for(const o of _ob){const dx=u.x-o.x,dy=u.y-o.y,d=Math.hypot(dx,dy),m=o.r+ur;if(d<m){const k=d||.01;u.x=o.x+dx/k*m;u.y=o.y+dy/k*m;}}}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0;}
for(let v=0;v<10;v++){
  const c=document.createElement('canvas');c.width=c.height=TILE;const q=c.getContext('2d');
  q.fillStyle='#78bf63';q.fillRect(0,0,TILE,TILE);
  let s=v*977+13;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<9;i++){q.fillStyle=r()<.5?'#6aaf56':'#86cb70';const x=r()*TILE|0,y=r()*TILE|0;q.fillRect(x,y,1,2);q.fillRect(x+1,y+1,1,1);}
  if(v<3){const cols=['#ffffff','#ffd23f','#ff9ab5'];const x=2+r()*(TILE-5)|0,y=2+r()*(TILE-5)|0;q.fillStyle=cols[v];
    q.fillRect(x+1,y,1,1);q.fillRect(x,y+1,1,1);q.fillRect(x+2,y+1,1,1);q.fillRect(x+1,y+2,1,1);q.fillStyle='#f6a623';q.fillRect(x+1,y+1,1,1);}
  if(v===3){q.fillStyle='#5f9f4d';q.fillRect(8,10,1,3);q.fillRect(10,9,1,4);q.fillRect(12,11,1,2);}
  TILES.push(c);
}

let ac=null,master=null,sfxBus=null,musBus=null,muted=false,noiseBuf=null;
try{muted=localStorage.getItem('shibasurv-mute')==='1';}catch(e){}
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();master=ac.createGain();master.gain.value=muted?0:.55;master.connect(ac.destination);
  sfxBus=ac.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
  musBus=ac.createGain();musBus.gain.value=.32;musBus.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(f,dur,type,vol,slide,when,bus){
  if(!ac)return;const t=when||ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(bus||sfxBus);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,freq,when,bus){
  if(!ac)return;const t=when||ac.currentTime;const s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;const g=ac.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t);s.stop(t+dur+.02);
}

// tiny chiptune loop
let mStep=0,mNext=0,mOn=false,intense=0;
const ROOTS=[0,-4,3,-2],PENTA=[0,3,5,7,10,12,15];
function music(){
  if(!ac||!mOn)return;
  if(mNext<ac.currentTime)mNext=ac.currentTime+.05;
  const ph=!G||state==='title'?0:G.endless?3:intense?2:G.T>150?1:0;
  const e=[.21,.19,.165,.16][ph],shift=[0,2,-3,-1][ph];
  while(mNext<ac.currentTime+.15){
    const s=mStep%32,bar=(mStep>>3)&3,root=110*Math.pow(2,(ROOTS[bar]+shift)/12);
    if(s%2===0)tone(root*(s%4===0?1:2),.16,'triangle',.22,0,mNext,musBus);
    if(s%2===1)noise(.03,.05,7000,mNext,musBus);
    if(ph>=1&&s%4===0)noise(.06,ph>=2?.09:.05,180,mNext,musBus);
    if(ph>=2&&s%8===4)noise(.08,.07,1400,mNext,musBus);
    const hz=hash(mStep>>1&63,7)%7;
    if((hash(mStep&63,3)%3)!==0)tone(root*4*Math.pow(2,PENTA[hz]/12)/2,.11,'square',.045,0,mNext,musBus);
    mNext+=e;mStep++;
  }
}

function nearest(n,maxR){

function weapons(dt){

function updateProj(dt){
  const p=G.p;
  for(const b of G.proj){
    if(b.type==='bone'){
      b.life-=dt;b.spin+=dt;if(b.life<=0){b.dead=true;continue;}
      for(let sub=0;sub<2&&!b.dead;sub++){b.x+=b.vx*dt/2;b.y+=b.vy*dt/2;
        query(b.x,b.y,4,(e)=>{if(b.dead||b.hit.has(e))return;b.hit.add(e);hurtEnemy(e,b.dmg,b.vx,b.vy,45,'bone');if(--b.pierce<=0)b.dead=true;});}
    }else if(b.type==='fris'){
      b.t+=dt;if(b.t>=b.dur){b.dead=true;continue;}
      const s=Math.sin(Math.PI*b.t/b.dur)*b.range,curve=Math.sin(Math.PI*2*b.t/b.dur)*14;
      b.x=p.x+Math.cos(b.a)*s-Math.sin(b.a)*curve;b.y=p.y-3+Math.sin(b.a)*s+Math.cos(b.a)*curve;
      query(b.x,b.y,5,(e,dx,dy)=>{if(G.T-e.hF>.28){e.hF=G.T;hurtEnemy(e,b.dmg,Math.cos(b.a),Math.sin(b.a),60,'fris');}});
    }
  }
  G.proj=G.proj.filter(b=>!b.dead);
  for(const w of G.paws){
    w.t+=dt;
    if(!w.done&&w.t>=w.fall){w.done=true;SFX.thump();G.shake=Math.max(G.shake,2.5);
      for(let i=0;i<10;i++){const a=i/10*Math.PI*2;addFx(w.x,w.y,Math.cos(a)*70,Math.sin(a)*50,.3,'#ffd6e3',2);}
      query(w.x,w.y,w.R,(e,dx,dy)=>hurtEnemy(e,w.dmg,dx,dy,120,'paw'));}
  }
  G.paws=G.paws.filter(w=>w.t<w.fall+.45);
  for(const r of G.rings)r.t+=dt;G.rings=G.rings.filter(r=>r.t<.32);
  for(const q of G.slashes)q.t+=dt;G.slashes=G.slashes.filter(q=>q.t<.2);
  for(const q of G.pops)q.t+=dt;G.pops=G.pops.filter(q=>q.t<(q.big?.5:.18));
}

  for(const k in WEAP){const l=G.w[k]||0;if(l<5)pool.push({k,kind:'w',l,wt:l?1.6:1.1});else if(l===5&&pl(WEAP[k].evo.pas))pool.push({k,kind:'e',l,wt:12});}
  for(const k in PAS){const l=G.pas[k]||0;if(l<5)pool.push({k,kind:'p',l,wt:.8});}
  const out=[];
  while(out.length<3&&pool.length){let s=pool.reduce((a,b)=>a+b.wt,0),r=Math.random()*s;let i=0;for(;i<pool.length;i++){r-=pool[i].wt;if(r<=0)break;}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);}
  if(!out.length)out.push({k:'heal',kind:'h',l:0});
  return out;
}
function applyChoice(c){

  else if(c.kind==='p'){G.pas[c.k]=(G.pas[c.k]||0)+1;if(c.k==='hp')G.p.hp=Math.min(maxHp(),G.p.hp+25);}

function inputVec(){
  let x=0,y=0;
  if(keys.ArrowLeft||keys.a)x--;if(keys.ArrowRight||keys.d)x++;if(keys.ArrowUp||keys.w)y--;if(keys.ArrowDown||keys.s)y++;

}

// ---------- update ----------
function update(dt){
  const p=G.p;
  if(G.won||p.dead){G.endT-=dt;if(G.endT<=0)endGame();}
  if(G.hitstop>0){G.hitstop-=dt;return;}
  dt*=G.slow;
  G.T+=dt;
  // player
  if(!p.dead){
    const [ix,iy]=inputVec();const sp=55*(1+.1*pl('speed'))*(G.coat==='goma'?1.12:1);
    p.moving=ix||iy;if(p.moving){G.moved=(G.moved||0)+dt;p.x+=ix*sp*dt;p.y+=iy*sp*dt;p.ang=Math.atan2(iy,ix);if(Math.abs(ix)>.15)p.face=ix>0?1:-1;p.anim+=dt*8;}
    p.inv=Math.max(0,p.inv-dt);
    if(p.hp/maxHp()<.3){G.beatT=(G.beatT||0)-dt;if(G.beatT<=0){G.beatT=p.hp/maxHp()<.15?.6:.9;SFX.beat();}}else G.beatT=0;
    const rg=.3*pl('regen')+(G.coat==='shiro'?.6:0);if(rg)p.hp=Math.min(maxHp(),p.hp+rg*dt);
  }
  if(!G.won&&!p.dead)spawner(dt);
  if(G.boss&&!G.boss.dead&&!p.dead)bossAI(G.boss,dt);
  for(const h of G.hz){h.x+=h.vx*dt;h.y+=h.vy*dt;h.life-=dt;h.spin+=dt;
    if(!p.dead&&!G.won&&p.inv<=0&&Math.hypot(h.x-p.x,h.y-(p.y-4))<h.r+4){p.hp-=Math.max(1,h.dmg-pl('armor'));p.inv=.55;G.shake=Math.max(G.shake,3);SFX.hurt();h.life=0;if(p.hp<=0){p.hp=0;p.dead=1;G.endT=1.6;SFX.lose();G.shake=8;}}}
  G.hz=G.hz.filter(h=>h.life>0&&!G.won);
  buildGrid();
  // enemies
  for(const e of G.en){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);e.slowT=Math.max(0,e.slowT-dt);
    const k=e.k;let vx,vy;
    if(e.lineVx){vx=e.lineVx;vy=0;if(Math.abs(e.x-p.x)>W)e.dead=true;}
    else if(e.ai&&e.ai.mode==='aim'){vx=0;vy=0;}
    else if(e.ai&&e.ai.mode==='dash'){const ds=e.kind==='husky'?190:240;vx=e.ai.dx*ds;vy=e.ai.dy*ds;e.face=e.ai.dx>0?1:-1;}
    else{const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;const s=k.spd*e.sm*(e.slowT>0?(e.kind==='boss'?.8:G.w.fart===6?.25:.6):1)*(G.won?0:1)*(e.kind==='boss'&&e.hp<e.max*.5?1.35:1)*(e.kind==='pug'&&((e.ai&&e.ai.hold>0)||l<60)?0:1);vx=dx/l*s;vy=dy/l*s;
      if(Math.abs(dx)>2)e.face=dx>0?1:-1;}
    e.x+=(vx+e.kx)*dt;e.y+=(vy+e.ky)*dt;const dmp=Math.exp(-dt*9);e.kx*=dmp;e.ky*=dmp;
    e.anim+=dt*(k.spd/6);
    if(e.kind==='pug'&&!G.won&&!p.dead){const ai=e.ai||(e.ai={t:1.5+Math.random()*1.5});ai.t-=dt;
      if(ai.t<=0){const dx=p.x-e.x,dy=p.y-4-(e.y-6),l=Math.hypot(dx,dy)||1;
        if(l<150&&onScreen(e)){G.hz.push({x:e.x,y:e.y-6,vx:dx/l*75,vy:dy/l*75,r:3,dmg:Math.round(9*e.dm),life:2.4,spin:0,spr:DROOL});ai.t=2.6+Math.random();ai.hold=.35;}else ai.t=.5;}
      if(ai.hold>0)ai.hold-=dt;}
    if(e.kind==='husky'&&!G.won){const ai=e.ai||(e.ai={mode:'walk',t:1+Math.random()*2});ai.t-=dt;
      if(ai.mode==='walk'&&ai.t<=0){const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;if(l<110&&onScreen(e)){ai.mode='aim';ai.t=.6;ai.dx=dx/l;ai.dy=dy/l;}else ai.t=.4;}
      else if(ai.mode==='aim'&&ai.t<=0){ai.mode='dash';ai.t=.55;}
      else if(ai.mode==='dash'&&ai.t<=0){ai.mode='walk';ai.t=2+Math.random();}}
    // despawn far stragglers back toward screen edge
    if(!e.lineVx&&e.kind!=='boss'&&Math.hypot(e.x-p.x,e.y-p.y)>Math.hypot(W,H)*.9){const [x,y]=edgePoint();e.x=x;e.y=y;}
  }
  for(const e of G.en){if(!e.dead&&e.kind!=='boss'&&e.kind!=='dal')pushOut(e,e.r*.8);}
  if(!p.dead)pushOut(p,4);
  // separation (light)
  for(const e of G.en){if(e.dead)continue;
    query(e.x,e.y,e.r*.8,(o,dx,dy)=>{if(o===e)return;const d=Math.hypot(dx,dy)||.01,ov=(e.r+o.r)*.8-d;if(ov>0){const push=ov*.25;o.x+=dx/d*push;o.y+=dy/d*push;}});}
  // contact damage
  if(!p.dead&&!G.won&&p.inv<=0){
    let worst=0;query(p.x,p.y-4,4,(e)=>{worst=Math.max(worst,Math.round(e.k.dmg*e.dm));});
    if(worst){p.hp-=Math.max(1,worst-pl('armor'));p.inv=.55;G.shake=Math.max(G.shake,3);SFX.hurt();G.hitstop=.05;buzz(25);
      for(let i=0;i<6;i++)addFx(p.x,p.y-4,(Math.random()-.5)*60,(Math.random()-.5)*60,.3,'#ff5e57',2);
      if(p.hp<=0){p.hp=0;p.dead=1;G.endT=1.6;SFX.lose();G.shake=8;}}
  }
  weapons(p.dead?0:dt);
  updateProj(dt);
  G.en=G.en.filter(e=>!e.dead);
  // gems
  const mr=36*(1+.3*pl('magnet'));
  for(const g of G.gems){
    const dx=p.x-g.x,dy=p.y-3-g.y,d=Math.hypot(dx,dy)||1;
    if(!g.m&&d<mr)g.m=true;
    if(g.m&&!p.dead){const a=Math.min(1,dt*8);const sp=Math.max(120,d*6);g.vx+=(dx/d*sp-g.vx)*a;g.vy+=(dy/d*sp-g.vy)*a;g.x+=g.vx*dt;g.y+=g.vy*dt;
      if(d<6){g.dead=true;grantXp(g.v);SFX.gem();if(Math.random()<.5)addFx(p.x+(Math.random()-.5)*8,p.y-8,(Math.random()-.5)*20,-30,.3,g.v>=3?'#ffd23f':'#ffffff',1);}}
  }
  G.gems=G.gems.filter(g=>!g.dead);
  for(const it of G.items){it.t+=dt;const d=Math.hypot(p.x-it.x,p.y-3-it.y);
    if(d<9&&!p.dead){it.dead=true;
      if(it.type==='meat'){p.hp=Math.min(maxHp(),p.hp+30);SFX.heal();G.nums.push({x:p.x,y:p.y-16,v:'+30',t:0,heal:true});}
      if(it.type==='bag'){G.gems.forEach(g=>g.m=true);SFX.pick();banner('ぜんぶクンクン!','#c6b6ff');}
      if(it.type==='chest'){chestReward();}
      if(it.type==='bell'){bellBlast();}}}
  G.items=G.items.filter(i=>!i.dead);
  for(const f of G.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}
  G.fx=G.fx.filter(f=>f.t<f.life);
  for(const n of G.nums)n.t+=dt;G.nums=G.nums.filter(n=>n.t<(n.word?.7:.6));
  if(G.banner){G.banner.life-=dt;if(G.banner.life<=0)G.banner=null;}
  G.shake=Math.max(0,G.shake-dt*14);if(G.flash>0)G.flash-=dt;
  if(G.pendingLv>0&&!p.dead&&!G.won)openLevel();
}

function spr(s,x,y,flip,flash){px.drawImage(flash?(flip?s.fl:s.fr):(flip?s.l:s.r),Math.round(x-camX-s.w/2),Math.round(y-camY-s.h));}

  for(let ty=ty0;ty<=ty0+Math.ceil(H/TILE)+1;ty++)for(let tx=tx0;tx<=tx0+Math.ceil(W/TILE)+1;tx++){
    const h=hash(tx,ty)%40;px.drawImage(TILES[h<10?h:3+(h%7)],tx*TILE-camX,ty*TILE-camY);}

    if(!w.done){const k=w.t/w.fall;const sc=Math.max(1,Math.min(3,Math.round(w.R/8)));const h=(1-k)*90;
      px.drawImage(PAW.r,Math.round(w.x-camX-PAW.w*sc/2),Math.round(w.y-camY-PAW.h*sc/2-h),PAW.w*sc,PAW.h*sc);}
    else{const k=(w.t-w.fall)/.45;px.globalAlpha=1-k;const sc=Math.max(1,Math.min(3,Math.round(w.R/8)));px.drawImage(PAW.r,Math.round(w.x-camX-PAW.w*sc/2),Math.round(w.y-camY-PAW.h*sc/2),PAW.w*sc,PAW.h*sc);px.globalAlpha=1;
      if(k<.4)pxRing(w.x,w.y,w.R*(.6+k*1.5),'#ffffff',.6);}}
  // death pops: white silhouette that squashes and vanishes
  for(const q of G.pops){const life=q.big?.5:.18,k=q.t/life,sw=1+k*.6,sh=1-k*.7,img=q.f<0?q.s.fl:q.s.fr;
    px.globalAlpha=1-k;px.drawImage(img,Math.round(q.x-camX-q.s.w*sw/2),Math.round(q.y-camY-q.s.h*sh),Math.round(q.s.w*sw),Math.max(1,Math.round(q.s.h*sh)));px.globalAlpha=1;
    if(q.big)pxRing(q.x,q.y-6,10+k*50,'#ffd23f',.7);}
  // leash swings
  for(const q of G.slashes){if(q.t<0)continue;const k=q.t/.2;px.globalAlpha=1-k;
    if(q.ring){pxRing(q.x,q.y,q.len*(.5+k*.5),'#e2574c',.8);pxRing(q.x,q.y,q.len*(.45+k*.5),'#ffb3a6',.8);}
    else{const x0=q.x-camX,y0=q.y-camY;for(let i=0;i<=q.len;i+=2){const yy=Math.sin(i/q.len*Math.PI)*-7*(1-k)+Math.sin(i*.4+q.t*40)*1.2;
      px.fillStyle=OUT;px.fillRect(Math.round(x0+q.dir*i),Math.round(y0+yy)-1,2,4);px.fillStyle=i%6<3?'#e2574c':'#ffb3a6';px.fillRect(Math.round(x0+q.dir*i),Math.round(y0+yy),2,2);}}
    px.globalAlpha=1;}
  // bark rings
  for(const r of G.rings){const k=r.t/.32;pxRing(r.x,r.y,r.R*(.3+.7*k),k<.5?'#ffffff':'#ffd23f',.8);}
  // time of day: afternoon -> sunset before the boss -> night in endless
  {const T=G.T;let c=null,a=0;
    if(state!=='title'){if(G.endless){c='20,30,80';a=Math.min(.32,.18+(T-BOSS_T)/900);}
      else if(T>150){c='255,120,40';a=Math.min(.2,(T-150)/150*.2);}}
    if(a>0){px.fillStyle=`rgba(${c},${a})`;px.fillRect(0,0,W,H);}
    if(G.endless){for(let i=0;i<14;i++){const sx=(hash(i,9)%W),sy=(hash(i,4)%H);if(((G.T*2+i)|0)%5){px.fillStyle='rgba(255,244,200,.55)';px.fillRect(sx,sy,1,1);}}}}
  // fx
  for(const f of G.fx){px.fillStyle=f.c;const s=f.s*(1-f.t/f.life*.5);px.fillRect(Math.round(f.x-camX),Math.round(f.y-camY),Math.max(1,Math.round(s)),Math.max(1,Math.round(s)));}

  // blit
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state!=='title')hud();
}
function txt(t,x,y,size,col,align,outline){
  const f=`${size}px ${FONT}`;if(f!==lastFont){ctx.font=f;lastFont=f;}
  ctx.textAlign=align||'left';ctx.textBaseline='middle';
  const o=outline??Math.max(2,size/8);ctx.lineJoin='round';ctx.lineWidth=o*2;ctx.strokeStyle=OUT;ctx.strokeText(t,x,y);
  ctx.fillStyle=col;ctx.fillText(t,x,y);
}
function hud(){
  const p=G.p,top=safeTop;
  // damage numbers
  for(const n of G.nums){const k=n.t/(n.word?.7:.6);const x=(n.x-camX)*S,y=(n.y-camY)*S-k*22;
    ctx.globalAlpha=k>.7?1-(k-.7)/.3:1;
    if(n.word)txt(n.v,x,y,20,'#fff4dc','center',3);
    else txt(String(n.v),x,y,n.crit?17:13,n.heal?'#7be05a':n.crit?'#ffd23f':'#ffffff','center',2);
  }
  ctx.globalAlpha=1;
  // xp bar
  ctx.fillStyle=OUT;ctx.fillRect(0,top,cssW,14);ctx.fillStyle='#5a3b2a';ctx.fillRect(2,top+2,cssW-4,10);
  ctx.fillStyle='#ffd23f';ctx.fillRect(2,top+2,(cssW-4)*Math.min(1,G.xp/G.need),10);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(2,top+2,(cssW-4)*Math.min(1,G.xp/G.need),3);
  txt('Lv'+G.lv,8,top+26,18,'#fff4dc','left',3);
  // time
  const t=G.endless?G.T:Math.min(G.T,BOSS_T),mm=String((t/60)|0).padStart(2,'0'),ss=String((t%60)|0).padStart(2,'0');
  const bossOn=G.boss&&!G.boss.dead;
  txt(bossOn?'BOSS':`${G.endless?'∞ ':''}${mm}:${ss}`,cssW/2,top+30,26,bossOn?'#ff7a7a':'#fff4dc','center',3);
  txt(`たおした ${G.kills}`,cssW-56,top+26,14,'#fff4dc','right',2);
  // owned icons
  let ix=8;const iy=top+44;
  for(const k in G.w){const ev=G.w[k]===6;icon(ev?WEAP[k].evo.ch:WEAP[k].ch,ev?'#ffd23f':WEAP[k].col,Math.min(5,G.w[k]),ix,iy,ev);ix+=26;}
  ix=8;for(const k in G.pas){icon(PAS[k].ch,PAS[k].col,G.pas[k],ix,iy+26);ix+=26;}
  // boss bar
  if(bossOn){const b=G.boss,bw=Math.min(300,cssW-40),bx=(cssW-bw)/2,by=cssH-safeBot-34;
    ctx.fillStyle=OUT;ctx.fillRect(bx-3,by-3,bw+6,16);ctx.fillStyle='#5a2020';ctx.fillRect(bx,by,bw,10);ctx.fillStyle='#ff5e7a';ctx.fillRect(bx,by,bw*Math.max(0,b.hp/b.max),10);
    txt(b.dal?'ダルメシアン':'セントバーナード',cssW/2,by-14,14,'#fff4dc','center',2);}
  // off-screen pointers to treasure boxes
  for(const it of G.items){if(it.type!=='chest')continue;const dx=(it.x-p.x)*S,dy=(it.y-4-p.y)*S;if(Math.abs(dx)<cssW/2-10&&Math.abs(dy)<cssH/2-10)continue;
    const top=safeTop+96,bot=cssH-safeBot-84,cx=cssW/2,cy=cssH/2,k=Math.min((cssW/2-26)/Math.abs(dx||1e-6),((dy<0?cy-top:bot-cy))/Math.abs(dy||1e-6));
    const ax=cx+dx*k,ay=cy+dy*k,ang=Math.atan2(dy,dx);ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);ctx.fillStyle=OUT;ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-6,-10);ctx.lineTo(-6,10);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-3,-6);ctx.lineTo(-3,6);ctx.closePath();ctx.fill();ctx.restore();}
  // off-screen pointers to the boss and crowned dogs
  for(const e of G.en){if(e.dead||(e.kind!=='boss'&&e.kind!=='elite'))continue;
    const dx=(e.x-p.x)*S,dy=(e.y-8-p.y)*S;if(Math.abs(dx)<cssW/2-10&&Math.abs(dy)<cssH/2-10)continue;
    const top=safeTop+96,bot=cssH-safeBot-84,cx=cssW/2,cy=cssH/2;
    const k=Math.min((cssW/2-26)/Math.abs(dx||1e-6),((dy<0?cy-top:bot-cy))/Math.abs(dy||1e-6));
    const ax=cx+dx*k,ay=cy+dy*k,ang=Math.atan2(dy,dx),big=e.kind==='boss',pul=1+.12*Math.sin(G.T*10);
    ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);ctx.scale(pul,pul);ctx.fillStyle=OUT;
    ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-12);ctx.lineTo(-8,12);ctx.closePath();ctx.fill();
    ctx.fillStyle=big?'#ff5e7a':'#c6b6ff';ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-5,-8);ctx.lineTo(-5,8);ctx.closePath();ctx.fill();ctx.restore();
    if(big)txt('BOSS',ax-Math.cos(ang)*24,ay-Math.sin(ang)*24,12,'#ff5e7a','center',2);}
  // banner
  if(G.banner){const b=G.banner,k=b.life;const a=Math.min(1,k*3,(2.4-k)*6);ctx.globalAlpha=Math.max(0,a);
    const y=cssH*.32,sc=1+Math.max(0,(2.25-k))*0;ctx.fillStyle='rgba(43,26,18,.6)';ctx.fillRect(0,y-24,cssW,48);
    txt(b.t,cssW/2,y,24*sc,b.c,'center',3);ctx.globalAlpha=1;}
  // stick
  if(stick&&state==='play'){ctx.globalAlpha=.35;ctx.strokeStyle='#fff4dc';ctx.lineWidth=3;ctx.beginPath();ctx.arc(stick.ox,stick.oy,46,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#fff4dc';ctx.beginPath();ctx.arc(stick.x,stick.y,18,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  // first-run hint: a finger sliding under the shiba until the player has moved a little
  if(G.hint&&(G.moved||0)<.6&&G.T<12){const k=(G.T*1.2)%1,fx=cssW/2+Math.sin(k*Math.PI*2)*50,fy=cssH*.66;
    ctx.globalAlpha=.9;ctx.fillStyle='#fff4dc';ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.beginPath();ctx.arc(fx,fy,16,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx-60,fy);ctx.lineTo(fx+60,fy);ctx.setLineDash([4,6]);ctx.strokeStyle='#fff4dc';ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    txt('どこでもなぞって移動',cssW/2,fy+40,16,'#fff4dc','center',2);}
  if(G.flash>0){ctx.globalAlpha=Math.min(1,G.flash/.35)*.8;ctx.fillStyle='#fff8e0';ctx.fillRect(0,0,cssW,cssH);ctx.globalAlpha=1;}
  // low hp vignette
  if(p.hp/maxHp()<.3&&!p.dead){ctx.globalAlpha=.25+.15*Math.sin(G.T*8);ctx.strokeStyle='#ff3b3b';ctx.lineWidth=14;ctx.strokeRect(0,0,cssW,cssH);ctx.globalAlpha=1;}
}
function icon(ch,col,lv,x,y,ev){
  if(ev){ctx.fillStyle=((G.T*4)|0)%2?'#fff4dc':'#ff7a7a';ctx.fillRect(x-2,y-2,26,26);}
  ctx.fillStyle=OUT;ctx.fillRect(x,y,22,22);ctx.fillStyle=col;ctx.fillRect(x+2,y+2,18,18);
  const f=`14px ${FONT}`;if(f!==lastFont){ctx.font=f;lastFont=f;}ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=OUT;ctx.fillText(ch,x+11,y+11);
  for(let i=0;i<lv;i++){ctx.fillStyle=OUT;ctx.fillRect(x+1+i*4,y+21,4,4);ctx.fillStyle='#ffd23f';ctx.fillRect(x+2+i*4,y+22,2,2);}
}

// ---------- flow ----------
const $=id=>document.getElementById(id);
function fmt(t){t=Math.floor(t);return `${(t/60)|0}分${String(t%60).padStart(2,'0')}秒`;}
function showBest(){$('bestLine').textContent=best.time?`ベスト ${fmt(best.time)} ・ ${best.kills}匹 ・ ボス撃破 ${best.wins}回`+(best.endless?` ・ エンドレス ${fmt(best.endless)}`:'')+(best.hardWins?` ・ はげしい撃破 ${best.hardWins}回`:''):'';}
showBest();
function renderCoats(){
  const box=$('coats');box.innerHTML='';
  for(const k in COATS){const c=COATS[k],open=!c.lock||c.lock.ok(best);
    const b=document.createElement('button');b.className='coat'+(open?'':' locked');b.id='coat-'+k;b.setAttribute('role','radio');b.setAttribute('aria-checked',String(k===coat));
    const cv2=document.createElement('canvas');const sp=c.spr[0];cv2.style.width=sp.w*3+"px";cv2.style.height=sp.h*3+"px";cv2.width=sp.w;cv2.height=sp.h;cv2.getContext('2d').drawImage(sp.r,0,0);b.appendChild(cv2);
    const nm=document.createElement('span');nm.textContent=c.name;b.appendChild(nm);
    if(!open){const sm=document.createElement('small');sm.textContent=c.lock.text;b.appendChild(sm);b.disabled=true;}
    b.addEventListener('click',()=>{coat=k;try{localStorage.setItem('shibasurv-coat',k);}catch(e){}renderCoats();});box.appendChild(b);}
  if(COATS[coat].lock&&!COATS[coat].lock.ok(best))coat='aka';
  const hardOpen=best.wins>=1;if(!hardOpen)diff='normal';
  $('modes').innerHTML='';
  for(const [k,label] of [['normal','ふつう'],['hard',hardOpen?'はげしい':'はげしい（未解放）']]){const b=document.createElement('button');b.className='mode'+(k==='hard'?' hard':'');b.id='mode-'+k;b.textContent=label;
    b.setAttribute('role','radio');b.setAttribute('aria-checked',String(diff===k));if(k==='hard'&&!hardOpen)b.disabled=true;
    b.addEventListener('click',()=>{diff=k;try{localStorage.setItem('shibasurv-diff',k);}catch(e){}renderCoats();});$('modes').appendChild(b);}
  $('perk').textContent=COATS[coat].perk;drawTitleShiba();
}
renderCoats();
function start(){
  initAudio();if(COATS[coat].lock&&!COATS[coat].lock.ok(best))coat='aka';newGame();state='play';mOn=true;intense=0;mStep=0;if(ac)mNext=ac.currentTime+.05;
  $('title').hidden=true;$('over').hidden=true;$('pause').hidden=true;$('pauseBtn').hidden=false;lastT=performance.now();
  G.nums.push({x:0,y:-20,v:'いくぞ!',t:0,word:true});G.hint=!best.time;G.moved=0;
}
function endGame(){
  if(state==='over')return;state='over';mOn=false;$('pauseBtn').hidden=true;stick=null;
  const win=G.won,t=Math.min(G.T,BOSS_T+999);const prevBest=Object.assign({},best);
  let rec=false;if(t>best.time){best.time=t;rec=true;}if(G.kills>best.kills){best.kills=G.kills;rec=true;}if(win&&!G.endless){best.wins++;if(G.hard)best.hardWins=(best.hardWins||0)+1;}if(G.endless&&G.T>(best.endless||0))best.endless=G.T;const before=Object.keys(COATS).filter(k=>COATS[k].lock&&COATS[k].lock.ok(prevBest));best.total=(best.total||0)+G.kills-(G.counted||0);G.counted=G.kills;saveBest();
  best.st=best.st||{};const newSt=STAMPS.filter(([c,n,d,ok])=>!best.st[c]&&ok(best,G));for(const st of newSt)best.st[st[0]]=1;saveBest();
  const fresh=Object.keys(COATS).filter(k=>COATS[k].lock&&COATS[k].lock.ok(best)&&!before.includes(k));
  $('overTitle').textContent=(G.hard?'【はげしい】':'')+(G.endless?'さんぽ終了':win?'ボスをたおした!':'やられた…');
  $('moreBtn').hidden=!(win&&!G.endless);
  $('overStats').innerHTML=`<span>生きのびた</span><b>${fmt(G.T)}</b><span>レベル</span><b>${G.lv}</b><span>たおした犬</span><b>${G.kills}匹</b>`;
  $('overBest').textContent=(fresh.length?fresh.map(k=>COATS[k].name).join('と')+'が仲間になった! ':'')+(rec?'自己ベスト更新!':`ベスト ${fmt(best.time)} ・ ${best.kills}匹`);
  if(newSt.length)$('overBest').innerHTML+=`<br><span class="newstamp">手帳にはんこ: ${newSt.map(x=>x[1]).join('、')}</span>`;
  renderCoats();
  const tot=Object.values(G.dmg).reduce((a,b)=>a+b,0)||1,rows=Object.entries(G.dmg).sort((a,b)=>b[1]-a[1]);
  $('dmgBars').innerHTML=rows.length?'<div class="cap">技ごとのダメージ</div>'+rows.map(([k,v])=>{const d=WEAP[k],ev=G.w[k]===6;
    return `<div class="row"><span class="sq" style="background:${ev?'#ffd23f':d.col}">${ev?d.evo.ch:d.ch}</span><span>${ev?d.evo.name:d.name}</span><span class="bar" style="width:${Math.max(2,Math.round(v/rows[0][1]*100))}%"></span></div>`;}).join(''):'';
  const top=rows[0]?(G.w[rows[0][0]]===6?WEAP[rows[0][0]].evo.name:WEAP[rows[0][0]].name):'';
  G.shareText=`しばサバイバー${G.hard?'【はげしい】':''}\n${COATS[G.coat].name}で${fmt(G.T)}生きのびた${win||G.endless?'（ボス撃破）':''}\nLv${G.lv}・${G.kills}匹${top?'・主力: '+top:''}\nhttps://yasufabric.github.io/shiba-survivor/`;
  $('copyBtn').textContent='結果をコピー';
  $('over').hidden=false;showBest();
}
function openPause(){if(state!=='play')return;state='pause';stick=null;
  $('pauseStats').innerHTML=`<span>時間</span><b>${fmt(G.T)}</b><span>レベル</span><b>${G.lv}</b><span>たおした犬</span><b>${G.kills}匹</b>`;
  const ks=Object.keys(G.w);$('pauseEvos').innerHTML=ks.length?'<div class="cap">進化の条件（技Lv5＋強化）</div>'+ks.map(k=>{const d=WEAP[k],l=G.w[k],ev=l===6,pas=PAS[d.evo.pas],has=pl(d.evo.pas)>0;
    const note=ev?`<span class="ok">進化ずみ: ${d.evo.name}</span>`:`<span class="${l>=5&&has?'ok':'no'}">Lv${l}/5・${pas.name}${has?'○':'×'}</span>`;
    return `<div class="row"><span class="sq" style="background:${ev?'#ffd23f':d.col}">${ev?d.evo.ch:d.ch}</span><span>${ev?'':d.name}</span>${note}</div>`;}).join(''):'';
  $('pause').hidden=false;}
$('startBtn').addEventListener('click',start);
$('retryBtn').addEventListener('click',start);
$('copyBtn').addEventListener('click',()=>{const t=G.shareText||'';const done=()=>{$('copyBtn').textContent='コピーしました';};
  try{navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));}catch(e){fallbackCopy(t,done);}});
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(ok)done();else $('copyBtn').textContent='コピーできませんでした';}
$('bookBtn').addEventListener('click',()=>{const st=best.st||{};$('stamps').innerHTML=STAMPS.map(([c,n,d])=>`<div class="stamp${st[c]?' got':''}"><b>${c}</b><span>${n}<br><small>${d}</small></span></div>`).join('');$('book').hidden=false;});
$('bookClose').addEventListener('click',()=>{$('book').hidden=true;});
$('rerollBtn').addEventListener('click',()=>{if(state!=='level'||G.rerolls<=0)return;G.rerolls--;SFX.throw();showCards(performance.now());});
$('moreBtn').addEventListener('click',()=>{if(!G.won)return;G.endless=true;G.won=false;G.slow=1;G.endT=0;G.nextBoss=G.T+150;G.bossN=1;
  $('over').hidden=true;$('pauseBtn').hidden=false;state='play';mOn=true;lastT=performance.now();banner('エンドレスさんぽ!','#ffd23f');});
$('titleBtn').addEventListener('click',()=>{$('over').hidden=true;state='title';newGame();renderCoats();$('title').hidden=false;});
$('pauseBtn').addEventListener('click',openPause);
$('resumeBtn').addEventListener('click',()=>{$('pause').hidden=true;state='play';lastT=performance.now();});
$('soundBtn').addEventListener('click',()=>{initAudio();setMute(!muted);});
function renderOpts(){$('shakeBtn').textContent='画面ゆれ: '+(OPT.shake?'ON':'OFF');$('buzzBtn').textContent='ふるえ: '+(OPT.buzz?'ON':'OFF');try{localStorage.setItem('shibasurv-opt',JSON.stringify(OPT));}catch(e){}}
$('shakeBtn').addEventListener('click',()=>{OPT.shake=!OPT.shake;renderOpts();});
$('buzzBtn').addEventListener('click',()=>{OPT.buzz=!OPT.buzz;renderOpts();});
renderOpts();
$('quitBtn').addEventListener('click',()=>{$('pause').hidden=true;G.p.dead=1;state='play';G.endT=0;endGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')openPause();});

let lastT=performance.now();
newGame(); // idle world behind title
document.fonts&&document.fonts.ready.then(()=>{});
function frame(now){
  const dt=Math.max(0,Math.min(.033,(now-lastT)/1000));lastT=Math.max(lastT,now);
  if(state==='play')update(dt);
  else if(state==='title'){G.T+=dt;G.p.moving=true;G.p.anim+=dt*8;G.p.x+=dt*30;G.p.face=1;}
  music();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
